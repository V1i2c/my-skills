name: Focus Harbor Android CI

on:
  push:
    paths:
      - "focus-app/**"
      - ".github/workflows/focus-app.yml"
  pull_request:
    paths:
      - "focus-app/**"
      - ".github/workflows/focus-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-harbor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run domain unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace > focus-app-test.log 2>&1
          status=$?
          cat focus-app-test.log
          exit "$status"
        working-directory: focus-app

      - name: Build installable debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > focus-app-build.log 2>&1
          status=$?
          cat focus-app-build.log
          exit "$status"
        working-directory: focus-app

      - name: Surface Gradle failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from html import escape
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          build_log = Path("focus-app/focus-app-build.log")
          test_log = Path("focus-app/focus-app-test.log")
          log = build_log if build_log.exists() else test_log
          details = []
          if log.exists():
              lines = log.read_text(errors="replace").splitlines()
              markers = ("FAILURE:", "WHAT WENT WRONG", "EXECUTION FAILED", "FAILED", "COMPILATION ERROR", "UNRESOLVED REFERENCE", "ERROR:")
              details.extend(line for line in lines if line.lstrip().startswith("e:") or any(marker in line.upper() for marker in markers))
          for report in Path("focus-app/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.findall("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      details.append(f"{case.get('classname')}.{case.get('name')}: {failure.get('message', '')}")
                      if failure.text:
                          details.extend(failure.text.splitlines()[:12])
          if not details:
              details = lines[-20:] if log.exists() else ["No Gradle log file was created"]
          excerpt = "\n".join(details[:50])[:3_000]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Gradle failure details\n\n<pre>")
              summary.write(escape(excerpt))
              summary.write("</pre>\n")
          annotation = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle failure details::{annotation}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: focus-harbor-debug
          path: focus-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
